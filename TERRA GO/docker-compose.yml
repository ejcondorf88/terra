version: '3'
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: terra
      POSTGRES_PASSWORD: go123
      POSTGRES_DB: terrago
    depends_on:
      - db
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: terra
      POSTGRES_PASSWORD: go123
      POSTGRES_DB: terrago
    ports:
      - "5432:5432"